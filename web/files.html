<!doctype html>
<!-- catnet — by cole · github.com/yupthatscole -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<title>files — catnet.</title>
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/css/catnet.css">
<link rel="stylesheet" href="/css/apps.css">
</head>
<body>
<main class="wrap" id="main">
  <header class="phead">
    <div class="grow">
      <h1>files</h1>
      <p>share things with everyone on catnet, or keep them private. public files are also served at your <a id="siteLink" href="#">/~you/</a> address.</p>
    </div>
  </header>

  <section class="frame">
    <span class="label">upload</span>
    <label class="drop" id="drop">
      <input type="file" id="pick" multiple>
      <div class="row-flex" style="justify-content:center">
        <span id="dropIcon"></span>
        <span><b>tap to choose files</b> <span class="dim">or drop them here</span></span>
      </div>
      <div class="hint" id="limits">…</div>
    </label>
    <div class="row-flex" style="margin-top:10px">
      <label class="check" style="margin:0"><input type="checkbox" id="priv"> keep private (only you and admins)</label>
    </div>
    <div id="queue"></div>
  </section>

  <section>
    <div class="sec">storage</div>
    <div id="storage"></div>
  </section>

  <section>
    <div class="sec">everything <span class="count" id="count"></span></div>
    <div class="filters">
      <div class="seg" id="scope">
        <button data-s="all" class="on">all</button><button data-s="mine">mine</button><button data-s="img">pictures</button><button data-s="web">web</button>
      </div>
      <input type="text" id="q" placeholder="search…" style="max-width:220px;min-height:36px" aria-label="search files">
    </div>
    <div class="list" id="list" style="margin-top:10px"><div class="loading"><div class="tuft"></div>counting the boxes…</div></div>
  </section>
</main>
<script src="/js/catnet.js"></script>
<script src="/js/files.js"></script>
</body>
</html>
