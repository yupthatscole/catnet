; catnet — ESP32 offline internet
;
; Build firmware:        pio run
; Upload firmware:       pio run -t upload
; Upload web filesystem: pio run -t uploadfs
;
; The web assets live in web/. A pre-build script (tools/pio_prebuild.py)
; regenerates data/ from web/ on every PlatformIO run, so data/ never goes
; stale or ships empty files. See docs/UPLOADING.md.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_build.f_cpu = 160000000L

extra_scripts = pre:tools/pio_prebuild.py

build_flags =
  -DWEBSERVER_MAX_URI_LEN=1024

; test/ holds node + native PC tests (see docs/DEVELOPMENT.md), not on-device Unity tests
test_ignore = native, web
